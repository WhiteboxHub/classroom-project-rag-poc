
# classroom-project-rag-poc\docker-compose.yml

version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  chromadb:

    image: chromadb/chroma:latest

    restart: always
    environment:
      - IS_PERSISTENT=TRUE
    ports:

      - "${CHROMADB_PORT:-8000}:8000"

    volumes:
      - chroma_data:/chroma/chroma

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:

      - ./data:/app/data:ro
      - ./prompts:/app/prompts:ro
      - .:/app
    env_file:
      - docker.env
    environment:
      - PYTHONUNBUFFERED=1

    depends_on:
      - postgres
      - chromadb
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  postgres_data:
  chroma_data:
